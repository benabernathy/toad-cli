[package]
name = "toad-cli"
version = "0.5.0"
license = "MIT"
edition = "2024"
description = "A developer-friendly REST client called toad"
repository = "https://github.com/benabernathy/toad-cli"
readme = "README.md"

[[bin]]
name = "toad"
path = "src/main.rs"

# `cargo deb` and `cargo generate-rpm` build the Linux packages in the release workflow. With
# --target, both read the binary from target/<target>/release instead of target/release.
[package.metadata.deb]
name = "toad"
maintainer = "Benjamin Abernathy"
section = "web"
extended-description = """\
Toad runs HTTP requests defined in a TOML collection file and checks the results. \
It is meant for API smoke tests and integration tests, locally and in CI."""
assets = [
    ["target/release/toad", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/toad/README.md", "644"],
    ["LICENSE", "usr/share/doc/toad/LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "toad"
assets = [
    { source = "target/release/toad", dest = "/usr/bin/toad", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/toad/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/toad/LICENSE", mode = "644", doc = true },
]

[dependencies]
anyhow = "1.0.102"
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
indexmap = { version = "2.14.0", features = ["serde"] }
jks = { version = "0.3.3", default-features = false, features = ["rand"] }
p12-keystore = "0.3.1"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_path = "0.7.2"
toml = { version = "1.1.2", features = ["preserve_order"] }

[dev-dependencies]
jsonschema = { version = "0.58.4", default-features = false }
schemars = { version = "1.2.2", features = ["indexmap2"] }
tiny_http = "0.12.0"

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # CI runs on pull requests, but a tag can be pushed on any commit, so test again before building.
  # This also fails if schema/toad.schema.json wasn't regenerated after a settings change.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux builds run natively on Ubuntu 22.04, so the binaries need glibc 2.35 or older and run on
        # Ubuntu 22.04+, Debian 12+, Fedora, and RHEL 9+. Building natively instead of cross-compiling
        # also lets cargo-deb and cargo-generate-rpm detect the library dependencies, which they do by
        # running the binary's loader.
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf toad-${{ github.ref_name }}-${{ matrix.target }}.tar.gz toad
          mv toad-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ../../../

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path toad.exe -DestinationPath ../../../toad-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Install packaging tools
        if: contains(matrix.target, 'linux')
        run: cargo install --locked cargo-deb cargo-generate-rpm

      # Package metadata is in Cargo.toml under [package.metadata.deb] and [package.metadata.generate-rpm]
      - name: Package (deb and rpm)
        if: contains(matrix.target, 'linux')
        run: |
          mkdir packages
          cargo deb --no-build --target ${{ matrix.target }} --output packages/
          cargo generate-rpm --target ${{ matrix.target }} --output packages/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toad-${{ matrix.target }}
          path: |
            toad-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            packages/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # For schema/toad.schema.json. Checkout runs first so it can't clean out the artifacts.
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            toad-x86_64-unknown-linux-gnu/toad-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            toad-aarch64-unknown-linux-gnu/toad-${{ github.ref_name }}-aarch64-unknown-linux-gnu.tar.gz
            toad-x86_64-apple-darwin/toad-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            toad-aarch64-apple-darwin/toad-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            toad-x86_64-pc-windows-msvc/toad-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
            toad-*-unknown-linux-gnu/packages/*.deb
            toad-*-unknown-linux-gnu/packages/*.rpm
            schema/toad.schema.json
          generate_release_notes: true
  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
